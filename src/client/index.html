<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#16141f" />
		<title>pixip</title>
		<link rel="stylesheet" href="/base.css" />
		<link rel="stylesheet" href="/transcript.css" />
		<link rel="stylesheet" href="/list.css" />
		<link rel="stylesheet" href="/status.css" />
		<link rel="stylesheet" href="/composer.css" />
		<link rel="stylesheet" href="/sheets.css" />
		<link rel="icon" href="data:," />
	</head>
	<body>
		<header id="bar">
			<button id="back" class="ghost" hidden aria-label="Sessions">‹</button>
			<div id="titles">
				<div id="title">sessions</div>
				<div id="sub"></div>
			</div>
			<span id="dot" class="dot idle"></span>
			<button id="settings" class="ghost settings-btn" aria-label="Settings" title="Settings" hidden>⚙</button>
			<button id="stop" class="ghost" hidden aria-label="Stop">stop</button>
			<div id="more-wrap" class="bar-more">
				<div id="bar-menu" class="bar-menu" role="group" aria-label="Display options" hidden>
					<div id="scale" role="group" aria-label="Transcript text size">
						<button id="scale-down" class="ghost scale-btn" type="button" aria-label="Decrease transcript text size">
							A−
						</button>
						<output id="scale-value" class="scale-value" aria-live="polite">100%</output>
						<button id="scale-up" class="ghost scale-btn" type="button" aria-label="Increase transcript text size">
							A+
						</button>
					</div>
					<button id="reload" class="ghost" aria-label="Reload assets and config">reload</button>
				</div>
				<button
					id="more"
					class="ghost more-btn"
					type="button"
					aria-label="More options"
					aria-haspopup="true"
					aria-expanded="false"
					aria-controls="bar-menu"
				>
					…
				</button>
			</div>
		</header>

		<main id="list" hidden></main>
		<main id="session" hidden>
			<div id="log"></div>
			<button id="jump" class="jump" type="button" aria-label="Jump to newest" hidden>↓ jump to newest</button>
		</main>

		<div id="dock">
			<div id="menu" hidden role="listbox" aria-label="Commands"></div>
			<div id="attach-menu" hidden role="menu" aria-label="Add attachment">
				<button type="button" role="menuitem" data-attach="image">Photo or camera</button>
				<button type="button" role="menuitem" data-attach="file">Choose file</button>
			</div>
			<div id="queue" hidden aria-live="polite"></div>
			<form id="composer" hidden>
				<div id="attachment" hidden></div>
				<div id="compose-row">
					<button
						id="attach"
						type="button"
						aria-label="Add attachment"
						aria-haspopup="menu"
						aria-expanded="false"
						aria-controls="attach-menu"
					>
						+
					</button>
					<textarea
						id="input"
						rows="1"
						placeholder="message pi…"
						autocomplete="off"
						autocapitalize="sentences"
						spellcheck="false"
					></textarea>
					<button id="send" type="submit" aria-label="Send">↑</button>
				</div>
				<input id="image-input" type="file" accept="image/*" hidden />
				<input id="file-input" type="file" hidden />
			</form>
			<footer id="footer" hidden>
				<div class="addon-widgets above" hidden></div>
				<div class="addon-statuses" hidden></div>
				<div class="addon-widgets below" hidden></div>
				<div class="fline pwd"></div>
				<div class="fline stats"><span class="left"></span><span class="right"></span></div>
			</footer>
		</div>

		<div id="sheet" hidden role="dialog" aria-modal="true"></div>
		<div id="toast" hidden></div>

		<script type="module" src="/app.js"></script>
	</body>
</html>
